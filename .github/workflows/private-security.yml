name: Private dependency audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'giangi1986/ha-virtavo-ip360' && github.event.repository.private == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install uv
      - run: uv venv .venv --python 3.14
      - run: uv pip install --python .venv/bin/python -r requirements-test.txt
      - name: Audit the target environment without modifying dependencies
        run: >-
          uv tool run --from pip-audit==2.10.1 pip-audit
          --path .venv/lib/python3.14/site-packages
          --format json --output dependency-audit.json
          --progress-spinner off --strict
      - name: Retain the private audit result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
          retention-days: 7
